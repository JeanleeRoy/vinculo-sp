<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Vínculo no encontrado</title>
  <link rel="stylesheet" href="/css/not-found.css" />
  <meta name="description" content="El vínculo que estás buscando no existe o ha expirado." />
</head>
<body>
  <main class="not-found-container">
    <!-- Abanico de tarjetas flotantes estéticas (inspiradas en la referencia) -->
    <div class="cards-arc" aria-hidden="true">
      <!-- Tarjeta 1: Flor / Ramo sutil -->
      <div class="floating-card card-1">
        <svg class="card-inner" viewBox="0 0 72 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#24452a" />
              <stop offset="100%" stop-color="#142c19" />
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#c1)" />
          <!-- Silueta de hoja/arco decorativa -->
          <circle cx="36" cy="110" r="48" fill="#305838" opacity="0.6" />
          <path d="M 20 80 Q 36 30 52 40 Q 42 60 20 80 Z" fill="#e8c872" opacity="0.85" />
          <circle cx="48" cy="38" r="4" fill="#f7f1db" />
        </svg>
      </div>

      <!-- Tarjeta 2: Interior minimalista cálido -->
      <div class="floating-card card-2">
        <svg class="card-inner" viewBox="0 0 72 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f0ebe1" />
              <stop offset="100%" stop-color="#ded4c3" />
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#c2)" />
          <!-- Rayos de sol y marco -->
          <polygon points="10,0 35,0 15,100 0,100" fill="#ffffff" opacity="0.5" />
          <rect x="22" y="24" width="28" height="40" rx="3" fill="#c4b59d" opacity="0.45" />
          <line x1="16" y1="84" x2="56" y2="84" stroke="#8a765e" stroke-width="2" />
        </svg>
      </div>

      <!-- Tarjeta 3: Sobre con sello (tarjeta central) -->
      <div class="floating-card card-3">
        <svg class="card-inner" viewBox="0 0 72 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#f5efe6" />
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#c3)" />
          <polygon points="0,0 72,0 72,40 36,65 0,40" fill="#edd88a" opacity="0.3" />
          <circle cx="36" cy="62" r="9" fill="#c72a2a" />
          <circle cx="36" cy="62" r="7" fill="#a01e1e" />
          <circle cx="34" cy="60" r="2.5" fill="#ffffff" opacity="0.6" />
        </svg>
      </div>

      <!-- Tarjeta 4: Flores amarillas / primavera -->
      <div class="floating-card card-4">
        <svg class="card-inner" viewBox="0 0 72 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b332b" />
              <stop offset="100%" stop-color="#1f1b17" />
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#c4)" />
          <circle cx="36" cy="45" r="14" fill="#e6a817" opacity="0.85" />
          <circle cx="36" cy="45" r="8" fill="#4d2f00" />
          <path d="M 36 58 Q 38 85 45 95" stroke="#758a52" stroke-width="2" fill="none" />
        </svg>
      </div>

      <!-- Tarjeta 5: Espacio / arquitectura interior -->
      <div class="floating-card card-5">
        <svg class="card-inner" viewBox="0 0 72 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#faf5ec" />
              <stop offset="100%" stop-color="#e8dcce" />
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#c5)" />
          <!-- Arco arquitectónico -->
          <path d="M 18,100 L 18,50 A 18,18 0 0,1 54,50 L 54,100 Z" fill="#cfbeaa" opacity="0.5" />
          <line x1="36" y1="32" x2="36" y2="100" stroke="#b09e89" stroke-width="1" stroke-dasharray="2 2" />
        </svg>
      </div>
    </div>

    <!-- Halo de luz difusa -->
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- 404 Monumental -->
    <div class="error-code">404</div>

    <!-- Título y subtítulo editoriales -->
    <h1 class="error-title">Oops! Vínculo no encontrado.</h1>
    <p class="error-subtitle">
      El mensaje que buscas no existe, el enlace está incompleto o su tiempo ha expirado.
    </p>

    <!-- Botón CTA con microinteracción -->
    <a href="/" class="cta-button">
      <span>Volver al inicio</span>
      <span class="cta-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 7 17 L 17 7 M 7 7 L 17 7 L 17 17" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
    </a>
  </main>
</body>
</html>
