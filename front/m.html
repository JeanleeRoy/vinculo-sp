<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vínculo — Tu Mensaje Especial</title>
  <link rel="stylesheet" href="/css/landing.css" />
  <meta name="description" content="Un regalo se olvida, pero un vínculo se queda ahí, recordándote que alguien quiso que esto durara para siempre." />
</head>

<body>
  <div class="stage" id="stage" style="opacity: 0;">

    <!-- SOBRE (SVG orgánico) -->
    <div class="envelope" id="envelope" role="button" aria-label="Abrir sobre" tabindex="0">
      <svg class="env-svg" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#f5e6b8" />
            <stop offset="55%" stop-color="#e6cd85" />
            <stop offset="100%" stop-color="#c8a950" />
          </linearGradient>
          <linearGradient id="flapGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#edd88a" />
            <stop offset="100%" stop-color="#c8a34a" />
          </linearGradient>
          <linearGradient id="bottomFlap" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#d9be7a" />
            <stop offset="100%" stop-color="#b89540" />
          </linearGradient>
          <radialGradient id="wax" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#f76c6c" />
            <stop offset="30%" stop-color="#c72a2a" />
            <stop offset="70%" stop-color="#8a1414" />
            <stop offset="100%" stop-color="#4a0505" />
          </radialGradient>
          <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" />
          </filter>
        </defs>

        <!-- Sombra suave bajo el sobre -->
        <ellipse cx="160" cy="210" rx="130" ry="10" fill="rgba(120,80,20,.35)" filter="url(#softshadow)" />

        <!-- Cuerpo del sobre -->
        <path class="env-paper"
          d="M 8,18 Q 6,10 16,8 L 305,11 Q 314,12 313,22 L 316,196 Q 315,206 305,207 L 15,205 Q 5,204 6,194 Z"
          fill="url(#paper)" />

        <!-- Solapa inferior -->
        <path class="env-bottom-flap"
          d="M 8,110 L 160,178 L 313,108 L 316,196 Q 315,206 305,207 L 15,205 Q 5,204 6,194 Z" fill="url(#bottomFlap)"
          opacity=".7" />

        <!-- Pliegues interiores -->
        <path class="env-fold-left" d="M 8,18 L 160,120" stroke="rgba(107,63,29,.22)" stroke-width=".8" fill="none" />
        <path class="env-fold-right" d="M 313,22 L 160,120" stroke="rgba(107,63,29,.22)" stroke-width=".8" fill="none" />
        <path class="env-fold-bl" d="M 15,205 L 160,120" stroke="rgba(107,63,29,.18)" stroke-width=".7" fill="none" />
        <path class="env-fold-br" d="M 305,207 L 160,120" stroke="rgba(107,63,29,.18)" stroke-width=".7" fill="none" />

        <!-- Marco interior punteado -->
        <path class="env-inner-border" d="M 22,26 L 297,29 L 300,190 L 20,188 Z" fill="none"
          stroke="rgba(107,63,29,.28)" stroke-width=".7" stroke-dasharray="3 2" />

        <!-- Textura de papel -->
        <g class="env-texture" opacity=".08" stroke="#8a5a20" stroke-width=".3" fill="none">
          <line x1="20" y1="30" x2="80" y2="180" />
          <line x1="80" y1="20" x2="140" y2="200" />
          <line x1="180" y1="18" x2="240" y2="200" />
          <line x1="240" y1="20" x2="300" y2="180" />
        </g>

        <!-- Solapa superior -->
        <g class="env-flap-group">
          <path class="env-flap" d="M 8,18 Q 6,10 16,8 L 305,11 Q 314,12 313,22 L 165,122 Q 160,125 155,122 Z"
            fill="url(#flapGrad)" />
          <path d="M 30,20 L 155,110 M 290,22 L 165,110" stroke="rgba(107,63,29,.16)" stroke-width=".6" fill="none" />
        </g>

        <!-- Sello de cera -->
        <g class="env-seal-group">
          <path d="M 185,88 Q 195,82 200,88 Q 202,94 195,96 Q 188,96 185,88 Z" fill="#8a1414"
            transform="rotate(35 190 90)" />
          <circle cx="160" cy="105" r="22" fill="url(#wax)" />
          <ellipse cx="152" cy="97" rx="7" ry="4" fill="rgba(255,220,220,.5)" transform="rotate(-20 152 97)" />
          <text x="160" y="115" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700"
            font-size="24" fill="#fff2d6" style="filter: drop-shadow(0 1px 1px rgba(0,0,0,.4))">L</text>
        </g>
      </svg>
    </div>
    <div class="hint" id="hint">Toca el sobre</div>

    <!-- CONTENEDOR DEL RAMO -->
    <div class="bouquet" id="bouquet" aria-hidden="true"></div>

    <!-- PARTÍCULAS -->
    <div class="particles" id="particles"></div>

    <!-- FLASH -->
    <div class="flash"></div>

    <!-- MENSAJE DINÁMICO -->
    <div class="message" id="message">
      <div class="date" id="message-date">Cargando fecha...</div>
      <div class="greeting" id="nombre">Abriendo tu dedicatoria...</div>
      <div class="sub" id="sub-caption">— con cariño, un regalo de Vínculo 🌻</div>
    </div>
  </div>

  <!-- REPRODUCTOR VINILO (Se activa solo tras cargar la data del mensaje) -->
  <div class="vinyl-player" id="vinyl-player" role="button" aria-label="Reproducir o pausar música" tabindex="0">
    <div class="vinyl-disc" id="vinyl-disc">
      <div class="vinyl-label">
        <img src="https://cdn-images.dzcdn.net/images/cover/35601f23fac271b29dd218b284f7a7c6/0x1900-000000-80-0-0.jpg" alt="Floricienta - Flores Amarillas" />
        <div class="vinyl-hole"></div>
      </div>
    </div>
    <div class="vinyl-overlay" id="vinyl-overlay" aria-hidden="true">
      <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
      <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>
  </div>

  <!-- Contenedor oculto para la reproducción de audio -->
  <div id="yt-audio-container" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; left: -9999px;"></div>

  <!-- Scripts del motor vectorial -->
  <script src="/js/anatomia-flores-amarillas.js"></script>
  <script src="/js/motor.js"></script>

  <!-- Orquestador de mensaje -->
  <script type="module" src="/src/app.js"></script>
</body>

</html>
