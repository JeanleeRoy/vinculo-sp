<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Feliz día de la primavera 🌻 — Vínculo</title>
  <link rel="stylesheet" href="css/landing.css" />
  <meta name="description"
    content="Un regalo se olvida, pero un vínculo se queda ahí, colgado en la pared, sobre tu escritorio, en tu mesa de noche, recordándote que alguien, en algún momento, quiso que esto durara para siempre.">
</head>

<body>
  <div class="stage" id="stage">

    <!-- SOBRE (SVG orgánico) -->
    <div class="envelope" id="envelope" role="button" aria-label="Abrir sobre">
      <svg class="env-svg" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#f5e6b8" />
            <stop offset="55%" stop-color="#e6cd85" />
            <stop offset="100%" stop-color="#c8a950" />
          </linearGradient>
          <linearGradient id="flapGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#edd88a" />
            <stop offset="100%" stop-color="#c8a34a" />
          </linearGradient>
          <linearGradient id="bottomFlap" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#d9be7a" />
            <stop offset="100%" stop-color="#b89540" />
          </linearGradient>
          <radialGradient id="wax" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#f76c6c" />
            <stop offset="30%" stop-color="#c72a2a" />
            <stop offset="70%" stop-color="#8a1414" />
            <stop offset="100%" stop-color="#4a0505" />
          </radialGradient>
          <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" />
          </filter>
        </defs>

        <!-- Sombra suave bajo el sobre -->
        <ellipse cx="160" cy="210" rx="130" ry="10" fill="rgba(120,80,20,.35)" filter="url(#softshadow)" />

        <!-- Cuerpo del sobre con esquinas orgánicas (path irregular, no rectángulo) -->
        <path class="env-paper"
          d="M 8,18 Q 6,10 16,8 L 305,11 Q 314,12 313,22 L 316,196 Q 315,206 305,207 L 15,205 Q 5,204 6,194 Z"
          fill="url(#paper)" />

        <!-- Solapa inferior (trapecio con inclinación irregular) -->
        <path class="env-bottom-flap"
          d="M 8,110 L 160,178 L 313,108 L 316,196 Q 315,206 305,207 L 15,205 Q 5,204 6,194 Z" fill="url(#bottomFlap)"
          opacity=".7" />

        <!-- Solapas laterales sugeridas: 2 líneas de pliegue en V desde esquinas al centro -->
        <path class="env-fold-left" d="M 8,18 L 160,120" stroke="rgba(107,63,29,.22)" stroke-width=".8" fill="none" />
        <path class="env-fold-right" d="M 313,22 L 160,120" stroke="rgba(107,63,29,.22)" stroke-width=".8"
          fill="none" />
        <path class="env-fold-bl" d="M 15,205 L 160,120" stroke="rgba(107,63,29,.18)" stroke-width=".7" fill="none" />
        <path class="env-fold-br" d="M 305,207 L 160,120" stroke="rgba(107,63,29,.18)" stroke-width=".7" fill="none" />

        <!-- Marco interior dashed (textura de papel) -->
        <path class="env-inner-border" d="M 22,26 L 297,29 L 300,190 L 20,188 Z" fill="none"
          stroke="rgba(107,63,29,.28)" stroke-width=".7" stroke-dasharray="3 2" />

        <!-- Textura sutil de papel: líneas diagonales muy suaves -->
        <g class="env-texture" opacity=".08" stroke="#8a5a20" stroke-width=".3" fill="none">
          <line x1="20" y1="30" x2="80" y2="180" />
          <line x1="80" y1="20" x2="140" y2="200" />
          <line x1="180" y1="18" x2="240" y2="200" />
          <line x1="240" y1="20" x2="300" y2="180" />
        </g>

        <!-- SOLAPA SUPERIOR (triangular con curvatura orgánica en la base) -->
        <g class="env-flap-group">
          <path class="env-flap" d="M 8,18 Q 6,10 16,8 L 305,11 Q 314,12 313,22 L 165,122 Q 160,125 155,122 Z"
            fill="url(#flapGrad)" />
          <!-- Línea sutil de pliegue interno del flap -->
          <path d="M 30,20 L 155,110 M 290,22 L 165,110" stroke="rgba(107,63,29,.16)" stroke-width=".6" fill="none" />
        </g>

        <!-- SELLO DE CERA -->
        <g class="env-seal-group">
          <!-- gota de cera derramada -->
          <path d="M 185,88 Q 195,82 200,88 Q 202,94 195,96 Q 188,96 185,88 Z" fill="#8a1414"
            transform="rotate(35 190 90)" />
          <!-- círculo principal del sello -->
          <circle cx="160" cy="105" r="22" fill="url(#wax)" />
          <!-- brillo especular -->
          <ellipse cx="152" cy="97" rx="7" ry="4" fill="rgba(255,220,220,.5)" transform="rotate(-20 152 97)" />
          <!-- monograma L -->
          <text x="160" y="115" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700"
            font-size="24" fill="#fff2d6" style="filter: drop-shadow(0 1px 1px rgba(0,0,0,.4))">L</text>
        </g>
      </svg>
    </div>
    <div class="hint" id="hint">Toca el sobre</div>

    <!-- CONTENEDOR DEL RAMO — el motor inyecta el SVG aquí -->
    <div class="bouquet" id="bouquet" aria-hidden="true"></div>

    <!-- PARTÍCULAS -->
    <div class="particles" id="particles"></div>

    <!-- FLASH final -->
    <div class="flash"></div>

    <!-- MENSAJE -->
    <div class="message" id="message">
      <div class="date">21 de septiembre · Día de la primavera</div>
      <div class="greeting">¡Feliz día, <span id="nombre">Amig@</span>!</div>
      <div class="sub">— con cariño, un regalo de Vínculo 🌻</div>
    </div>
  </div>

  <!-- Datos anatómicos del hook (reemplazable por otra fecha) -->
  <script src="js/anatomia-flores-amarillas.js"></script>
  <!-- Motor genérico de animación -->
  <script src="js/motor.js"></script>
  <!-- Bootstrap -->
  <script>
    (function () {
      // Nombre desde URL
      const params = new URLSearchParams(location.search);
      const nombre = (params.get("nombre") || params.get("n") || "Amig@").trim();
      document.getElementById("nombre").textContent = nombre.slice(0, 40);

      const stage = document.getElementById("stage");
      const envelope = document.getElementById("envelope");
      const bouquet = document.getElementById("bouquet");

      // Instanciar motor con la anatomía correspondiente a este hook
      const motor = new MotorAnatomico(window.ANATOMIA_FLORES_AMARILLAS, bouquet);
      motor.init();

      function abrir() {
        if (stage.classList.contains("opened")) return;
        stage.classList.add("opened");
        lanzarParticulas();
        // Esperar a que el sobre se desvanezca y arrancar el dibujado
        setTimeout(() => motor.play(), 1100);
      }
      envelope.addEventListener("click", abrir);
      envelope.addEventListener("touchstart", (e) => { e.preventDefault(); abrir(); }, { passive: false });

      function lanzarParticulas() {
        const cont = document.getElementById("particles");
        const totalMs = motor.duracionTotalMs() + 1100;
        for (let i = 0; i < 24; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          const size = 4 + Math.random() * 8;
          p.style.width = p.style.height = size + "px";
          p.style.left = (Math.random() * 100) + "%";
          p.style.setProperty("--drift", ((Math.random() * 80) - 40) + "px");
          p.style.animationDuration = (6 + Math.random() * 6) + "s";
          p.style.animationDelay = ((totalMs / 1000) - 0.5 + Math.random() * 4) + "s";
          cont.appendChild(p);
        }
        // Mostrar mensaje al final de la coreografía
        setTimeout(() => {
          document.getElementById("message").classList.add("visible");
        }, totalMs - 200);
      }
    })();
  </script>
</body>

</html>
